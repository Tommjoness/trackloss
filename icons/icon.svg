<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <!-- Background -->
  <rect width="512" height="512" rx="100" fill="#0d1b2a"/>
  
  <!-- Outer circle LG-style -->
  <circle cx="256" cy="256" r="210" fill="none" stroke="#00d4ff" stroke-width="18"/>
  
  <!-- Bike silhouette centered -->
  <!-- Rear wheel -->
  <circle cx="172" cy="300" r="72" fill="none" stroke="#00d4ff" stroke-width="18"/>
  <!-- Front wheel -->
  <circle cx="340" cy="300" r="72" fill="none" stroke="#00d4ff" stroke-width="18"/>
  <!-- Frame: seat tube -->
  <line x1="220" y1="210" x2="172" y2="300" stroke="#00d4ff" stroke-width="16" stroke-linecap="round"/>
  <!-- Frame: top tube -->
  <line x1="220" y1="210" x2="295" y2="210" stroke="#00d4ff" stroke-width="16" stroke-linecap="round"/>
  <!-- Frame: down tube -->
  <line x1="295" y1="210" x2="172" y2="300" stroke="#00d4ff" stroke-width="16" stroke-linecap="round"/>
  <!-- Frame: chainstay -->
  <line x1="220" y1="300" x2="172" y2="300" stroke="#00d4ff" stroke-width="16" stroke-linecap="round"/>
  <!-- Fork -->
  <line x1="295" y1="210" x2="340" y2="300" stroke="#00d4ff" stroke-width="16" stroke-linecap="round"/>
  <!-- Handlebar -->
  <line x1="295" y1="210" x2="318" y2="195" stroke="#00d4ff" stroke-width="14" stroke-linecap="round"/>
  <line x1="310" y1="185" x2="326" y2="205" stroke="#00d4ff" stroke-width="12" stroke-linecap="round"/>
  <!-- Seat -->
  <line x1="220" y1="210" x2="205" y2="196" stroke="#00d4ff" stroke-width="14" stroke-linecap="round"/>
  <line x1="193" y1="192" x2="218" y2="192" stroke="#00d4ff" stroke-width="12" stroke-linecap="round"/>

  <!-- TL letters bottom -->
  <text x="256" y="430" font-family="Arial Black, sans-serif" font-size="72" font-weight="900" text-anchor="middle" fill="#00d4ff" letter-spacing="4">TL</text>
</svg>
